CREATE TABLE authors (id SERIAL PRIMARY KEY, name TEXT NOT NULL, bio TEXT);
CREATE TABLE books (
  id SERIAL PRIMARY KEY,
  title TEXT NOT NULL,
  author_id INT REFERENCES authors(id) ON DELETE CASCADE,
  category TEXT CHECK (category IN ('ml','db','systems','ai')),
  total_copies INT CHECK (total_copies>=0),
  available_count INT CHECK (available_count>=0),
  isbn VARCHAR UNIQUE
);
CREATE TABLE students (usn VARCHAR PRIMARY KEY, name TEXT, email VARCHAR UNIQUE);
CREATE TABLE issued (
  id SERIAL PRIMARY KEY,
  book_id INT REFERENCES books(id),
  student_usn VARCHAR REFERENCES students(usn),
  issue_date DATE DEFAULT CURRENT_DATE,
  due_date DATE CHECK (due_date > issue_date),
  returned BOOLEAN DEFAULT false
);
-- Safe issue with lock to avoid double issue
BEGIN;
SELECT available_count FROM books WHERE id=1 FOR UPDATE;
UPDATE books SET available_count = available_count-1 WHERE id=1 AND available_count>0;
INSERT INTO issued(book_id, student_usn, due_date) VALUES (1,'1RV21CS001', CURRENT_DATE+14);
COMMIT;`,codeLang:"sql",whyAsked:"Tests normalization, constraints, foreign keys, race condition handling, real-world large volume design.",commonMistake:"Using VARCHAR for PK everywhere, forgetting FOR UPDATE leads to two students getting last copy, no UNIQUE on isbn/email, no CHECK on category.",followUps:["How to prevent double issue when 2 requests same time for last copy?","Why SERIAL vs UUID vs VARCHAR for PK?"]},{id:2,category:"DB Schema",type:"Real Scraped",difficulty:"Medium",title:"What are normalization forms 1NF, 2NF, 3NF?",source:"Real Scraped: What are different normal forms? Glassdoor 14k",analogy:'1NF = no list in one cell like "ml,db" should be separate rows. 2NF = no partial dependency. 3NF = no gossip via third table.',verifiedAnswer:"1NF: Every column atomic, no comma-separated values. 2NF: Table in 1NF + every non-key attribute fully dependent on whole composite PK (not partial). 3NF: In 2NF + no transitive dependency: non-key should not depend on non-key. Example violation: books(id, title, author_name, author_bio) - author_bio depends on author_name which depends on id = transitive. Fix: authors(id, name, bio) + books(author_id FK). BCNF, 4NF stricter but 3NF enough for interviews.",steps:['1NF: Make values atomic. Bad: books.tags = "ml,ai". Good: separate book_tags table.',"2NF: If PK = (student_id, book_id), then student_name depends only on student_id -> partial, move to students table.","3NF: If books has author_name and author_bio, bio depends on name not id -> move to authors table.","Normalization reduces redundancy but too much causes many JOINs. Often denormalize for read speed.","Check: Use dependency analysis to decide."],code:`-- BEFORE violates 3NF
CREATE TABLE books_bad (id INT PRIMARY KEY, title TEXT, author_name TEXT, author_bio TEXT);
-- AFTER 3NF
CREATE TABLE authors (id SERIAL PRIMARY KEY, name TEXT UNIQUE, bio TEXT);
CREATE TABLE books_good (id SERIAL PRIMARY KEY, title TEXT, author_id INT REFERENCES authors(id));
-- 2NF example composite
-- Bad: enroll(student_id, course_id, student_name) -> student_name partial
-- Good: students(student_id PK, student_name), enroll(student_id FK, course_id FK)`,codeLang:"sql",whyAsked:"Checks if you understand data redundancy, update anomalies, and design tradeoffs.",commonMistake:"Saying normalization always improves performance - actually more JOINs can slow reads. Forgetting atomicity in 1NF.",followUps:["When would you denormalize?","Explain BCNF with example."]},{id:3,category:"DB Schema",type:"Descriptive",difficulty:"Easy",title:"What is PRIMARY KEY, FOREIGN KEY, UNIQUE, CHECK?",source:"",analogy:'PK = USN, unique for each student. FK = reference slip pointing to USN. UNIQUE = no duplicate email. CHECK = canteen rule "age > 0".',verifiedAnswer:"PRIMARY KEY: Unique + NOT NULL, one per table, clustered index. Eg SERIAL or VARCHAR. FOREIGN KEY: Column referencing PK of other table, ensures referential integrity, can have ON DELETE CASCADE/SET NULL. UNIQUE: Ensures no duplicates but allows one NULL in Postgres, multiple in MySQL? Actually PG allows multiple NULLs? No, UNIQUE allows multiple NULLs. CHECK: Validates condition before insert/update. Ex: CHECK (available_count>=0).",steps:["PK automatically creates unique B-Tree index for fast lookups.","FK is enforced at DB level, prevents orphan records like issued with non-existing book_id.","UNIQUE vs PK: PK is UNIQUE+NOT NULL and only one, UNIQUE can be many per table.","CHECK runs before write, fails with constraint violation if false.","Use NOT NULL, DEFAULT, and FK actions to keep data clean."],code:`CREATE TABLE students (
  usn VARCHAR PRIMARY KEY,
  email VARCHAR UNIQUE NOT NULL,
  age INT CHECK (age >= 17),
  branch TEXT DEFAULT 'CSE'
);
CREATE TABLE issued (
  id SERIAL PRIMARY KEY,
  student_usn VARCHAR REFERENCES students(usn) ON DELETE CASCADE,
  book_id INT NOT NULL
);`,codeLang:"sql",whyAsked:"Basic integrity constraints - must know difference.",commonMistake:"Thinking FK automatically indexes child column (in MySQL yes, PG you must create index manually for performance), confusing UNIQUE with PK.",followUps:["Difference between UNIQUE and PRIMARY KEY index?","What happens on FK violation?"]},{id:4,category:"DB Schema",type:"Descriptive",difficulty:"Medium",title:"Indexes - B-Tree for category search, when to use and when not?",source:"",analogy:'Index = book back index page: instead of scanning whole book, go to index page for "ML" and get page numbers.',verifiedAnswer:"B-Tree index keeps keys sorted, O(log n) lookup, good for =, <, >, BETWEEN, LIKE prefix. Use for WHERE category='ml', ORDER BY, JOIN keys. Hash index O(1) only for =. Avoid indexing small tables, columns with low cardinality write-heavy, or if you always do full scan. Index costs: extra storage, slower INSERT/UPDATE. For library: CREATE INDEX idx_books_category ON books(category); For text search use GIN, for embedding vector use IVFFLAT/HNSW.",steps:["B-Tree stores sorted keys with pointers to rows, balanced tree depth ~ 3-4 for millions rows.","Query planner uses index if selectivity high: category='ml' with 5% rows -> uses index.","Composite index (category, author_id) helps WHERE category AND author_id queries, order matters.","Too many indexes slows writes: each INSERT must update all indexes.","Use EXPLAIN ANALYZE to verify index usage."],code:`-- Create B-Tree index (default)
CREATE INDEX idx_books_category ON books(category);
CREATE INDEX idx_books_author ON books(author_id);
-- Composite for common filter
CREATE INDEX idx_books_cat_available ON books(category, available_count);
EXPLAIN ANALYZE SELECT * FROM books WHERE category='ml' AND available_count>0;`,codeLang:"sql",whyAsked:"Tests understanding of performance, tradeoffs, not just syntax.",commonMistake:"Indexing every column, or expecting index to help LIKE %ml% (needs trigram GIN).",followUps:["Difference B-Tree vs Hash vs GIN?","How does composite index leftmost prefix work?"]},{id:5,category:"DB Schema",type:"Descriptive",difficulty:"Easy",title:"ER diagram crow's foot notation - 1 author many books, 1 student many issued",source:"",analogy:"Crow foot = many legs like many books. Single line = one author. Relationship = library card linking student to many books.",verifiedAnswer:"ER: Entity = rectangle (Author, Book, Student, Issued). Relationship: Author 1--* Book (one author writes many books). Student 1--* Issued, Book 1--* Issued. Crow's foot: || = one, o| = zero or one, }| = many. ||--o{ means one to zero-or-many. Also mark PK with underline. Weak entity Issued depends on Book+Student. Use crow foot to show cardinality quickly.",steps:["Identify entities: authors, books, students, issued.","Cardinality: One author can write many books (1:N). One student can have many issued records (1:N).","Crow notation: straight line = 1, crow foot (three lines) = many, circle = optional.","Add FKs at many side: books.author_id, issued.book_id, issued.student_usn.","Mark PK, FK, and constraints on diagram."],code:`-- ER as SQL FK representation
-- Author ||--o{ Book  (one to many)
-- Student ||--o{ Issued
-- Book ||--o{ Issued
SELECT a.name, COUNT(b.id) FROM authors a JOIN books b ON b.author_id=a.id GROUP BY a.name;
-- Many books per author`,codeLang:"sql",whyAsked:"Tests ability to model real world and communicate design.",commonMistake:"Drawing many-to-many directly without junction table, forgetting crow foot meaning.",followUps:["Model many-to-many students and clubs?","What is weak entity?"]},{id:6,category:"DB Schema",type:"MCQ",difficulty:"Easy",title:"MCQ: Which normal form removes transitive dependency?",analogy:"Transitive = gossip: A tells B, B tells C. Remove middleman.",verifiedAnswer:"3NF removes transitive dependency where non-key depends on non-key. 1NF atomic, 2NF removes partial dependency on composite key, BCNF removes dependency where determinant not superkey.",steps:["Recall definitions","Transitive = X->Y, Y->Z, so X->Z via Y","3NF eliminates that","BCNF stricter"],code:`-- 3NF violation example
-- books(id, author_name, author_email) where email depends on name not id
-- Fix: authors table`,codeLang:"sql",whyAsked:"Quick check of normalization basics.",commonMistake:"Confusing 2NF (partial) with 3NF (transitive).",followUps:["Give example of transitive violation?","What is BCNF?"],options:[{label:"A",text:"1NF"},{label:"B",text:"2NF"},{label:"C",text:"3NF"},{label:"D",text:"UNF"}],correct:"C",explanation:{correctWhy:"3NF is defined as no transitive dependency: non-key attribute should not depend on another non-key. Example author_email depends on author_name which depends on book id.",wrong:[{label:"A",reason:"1NF only ensures atomic values, not dependencies."},{label:"B",reason:"2NF removes partial dependency on composite PK, not transitive."},{label:"D",reason:"UNF is unnormalized, not a standard form."}],analogy:"Like removing middleman gossip: direct info only."}},{id:7,category:"DB Schema",type:"MCQ",difficulty:"Easy",title:"MCQ: What does ON DELETE CASCADE do?",analogy:"If library removes author rack, all his books removed automatically like cascade of dominoes.",verifiedAnswer:"When parent row deleted, child rows referencing it via FK with ON DELETE CASCADE are automatically deleted.",steps:["FK links child to parent","Without CASCADE, delete fails with FK violation","With CASCADE, DB deletes children","Alternative SET NULL sets FK to null"],code:`CREATE TABLE books (author_id INT REFERENCES authors(id) ON DELETE CASCADE);
-- DELETE FROM authors WHERE id=1; -- also deletes his books`,codeLang:"sql",whyAsked:"Referential actions.",commonMistake:"Thinking it deletes parent when child deleted - opposite.",followUps:["CASCADE vs SET NULL vs RESTRICT?","When to avoid CASCADE?"],options:[{label:"A",text:"Deletes parent when child deleted"},{label:"B",text:"Deletes child rows when parent deleted"},{label:"C",text:"Prevents deletion"},{label:"D",text:"Creates backup"}],correct:"B",explanation:{correctWhy:"CASCADE propagates delete from parent to child, keeping integrity.",wrong:[{label:"A",reason:"Opposite direction, child delete never deletes parent."},{label:"C",reason:"That is RESTRICT/NO ACTION."},{label:"D",reason:"No backup, just delete."}],analogy:"Domino: author domino falls, his books fall too."}},{id:8,category:"DB Schema",type:"MCQ",difficulty:"Medium",title:"MCQ: Best PK type for books table with 1M rows?",analogy:"PK like roll number: short, numeric, auto-increment fastest to search.",verifiedAnswer:"SERIAL (auto-increment INT) or BIGSERIAL for large, or UUID v4 if distributed. SERIAL is 4 bytes, indexed fast, sequential. VARCHAR ISBN as PK slower due to size and random insert causing page splits.",steps:["INT 4 bytes vs VARCHAR 13+","B-Tree faster with integer compare","SERIAL auto","UUID for distributed but random IO"],code:`CREATE TABLE books (id SERIAL PRIMARY KEY); -- 4 bytes
-- vs id UUID PRIMARY KEY DEFAULT gen_random_uuid()`,codeLang:"sql",whyAsked:"PK choice impacts performance.",commonMistake:"Using ISBN natural key as PK - large and not always present.",followUps:["UUID vs SERIAL tradeoffs?","What is page split?"],options:[{label:"A",text:"VARCHAR ISBN as PK"},{label:"B",text:"SERIAL INT PK, ISBN UNIQUE"},{label:"C",text:"No PK"},{label:"D",text:"Composite title+author"}],correct:"B",explanation:{correctWhy:"SERIAL PK is small, fast, sequential. ISBN kept UNIQUE for lookups but not PK.",wrong:[{label:"A",reason:"VARCHAR larger, slower index, ISBN may change."},{label:"C",reason:"Table without PK is bad design, cannot reference."},{label:"D",reason:"Composite text PK huge, duplicates possible."}],analogy:"Roll number vs name: roll number shorter and unique."}},{id:9,category:"DB Schema",type:"Descriptive",difficulty:"Medium",title:"Transactions and FOR UPDATE - preventing race condition in issue",source:"",analogy:"Two students grabbing last book same time like canteen last samosa - need token lock.",verifiedAnswer:"Without lock, both read available_count=1, both decrement to 0, double issue. Solution: BEGIN; SELECT ... FOR UPDATE locks row; check >0 then UPDATE and INSERT; COMMIT. Isolation level READ COMMITTED plus row lock ensures serialization. Alternative: UPDATE ... WHERE available_count>0 RETURNING.",steps:["Begin transaction","SELECT available_count FROM books WHERE id=1 FOR UPDATE - acquires exclusive row lock","If count>0, UPDATE books SET available_count=available_count-1","INSERT into issued","COMMIT releases lock"],code:`BEGIN;
SELECT * FROM books WHERE id=1 FOR UPDATE;
-- critical section
UPDATE books SET available_count = available_count-1 WHERE id=1 AND available_count>0;
-- check rows affected =1 then insert
INSERT INTO issued(book_id, student_usn) VALUES (1,'1RV21CS001');
COMMIT;`,codeLang:"sql",whyAsked:"Concurrency and ACID.",commonMistake:"Using plain SELECT then UPDATE without FOR UPDATE, or using dirty read.",followUps:["What is optimistic vs pessimistic locking?","How does isolation level affect?"]},{id:10,category:"DB Schema",type:"Descriptive",difficulty:"Medium",title:"Composite keys and junction tables for many-to-many",source:"",analogy:"Students and clubs: one student many clubs, one club many students - need attendance register (junction).",verifiedAnswer:"Many-to-many needs junction table with composite PK (student_id, club_id) both FKs. Composite PK ensures no duplicate pair. Example book_tags (book_id FK, tag_id FK, PRIMARY KEY(book_id,tag_id)).",steps:["Identify M:N","Create junction table","Both columns FK","Composite PK","Index both"],code:`CREATE TABLE tags (id SERIAL PRIMARY KEY, name TEXT UNIQUE);
CREATE TABLE book_tags (book_id INT REFERENCES books(id), tag_id INT REFERENCES tags(id), PRIMARY KEY(book_id, tag_id));
SELECT b.title FROM books b JOIN book_tags bt ON bt.book_id=b.id JOIN tags t ON t.id=bt.tag_id WHERE t.name='ml';`,codeLang:"sql",whyAsked:"Modeling M:N.",commonMistake:"Storing comma-separated tags violates 1NF.",followUps:["How to query M:N efficiently?"]},{id:11,category:"DB Schema",type:"Descriptive",difficulty:"Hard",title:"Denormalization tradeoffs - when to break 3NF?",source:"",analogy:"Normalized = separate spice boxes (clean but many opens). Denormalized = pre-mixed masala (fast but duplicate).",verifiedAnswer:"Denormalize for read-heavy, aggregation-heavy. Example store author_name in books to avoid JOIN for listing. Tradeoff: redundancy, update anomaly if author name changes need update many rows. Use materialized views, cached counts like total_issued_count in books updated via trigger.",steps:["Identify read-heavy query: list books with author name","JOIN cost high","Add author_name column to books","Use trigger to keep sync","Measure with EXPLAIN"],code:`-- Denormalized for speed
ALTER TABLE books ADD COLUMN author_name TEXT;
-- Trigger to sync
CREATE OR REPLACE FUNCTION sync_author() RETURNS TRIGGER AS $$ BEGIN UPDATE books SET author_name=NEW.name WHERE author_id=NEW.id; RETURN NEW; END; $$ LANGUAGE plpgsql;
CREATE TRIGGER t AFTER UPDATE ON authors FOR EACH ROW EXECUTE FUNCTION sync_author();`,codeLang:"sql",whyAsked:"Real-world tradeoff.",commonMistake:"Denormalizing too early without measurement.",followUps:["Materialized view vs denormalization?"]},{id:12,category:"DB Schema",type:"Descriptive",difficulty:"Hard",title:"ACID and schema design for fines",source:"",analogy:"ACID like bank transaction: money debits and credits both or none.",verifiedAnswer:"Atomicity: issue + decrement in one transaction. Consistency: CHECK ensures due_date>issue_date. Isolation: FOR UPDATE prevents double issue. Durability: COMMIT writes to WAL. Fines table with CHECK amount>=0, FK to issued.",steps:["Atomic: BEGIN/COMMIT","Consistency: constraints","Isolation: locks","Durability: WAL"],code:`CREATE TABLE fines (id SERIAL PRIMARY KEY, issued_id INT REFERENCES issued(id), amount INT CHECK(amount>=0), paid BOOLEAN DEFAULT false);
BEGIN; UPDATE issued SET returned=true WHERE id=1; INSERT INTO fines(issued_id, amount) VALUES (1, 50); COMMIT;`,codeLang:"sql",whyAsked:"ACID understanding.",commonMistake:"Ignoring isolation leading to phantom reads.",followUps:["WAL?"]},{id:13,category:"API",type:"Real Scraped",difficulty:"Easy",title:"What is REST API? 6 constraints of REST",source:"Top REST API 2024 - What is REST Client-server Constraint? Real Scraped",analogy:"Restaurant menu = API docs, order = request, food = response, waiter = HTTP.",verifiedAnswer:"REST = Representational State Transfer, architectural style by Roy Fielding. 6 constraints: 1) Client-Server separation, 2) Stateless - no client context on server, each request contains all info, 3) Cacheable - responses say if cacheable, 4) Uniform Interface - same verbs GET POST PUT DELETE, 5) Layered System - can have proxies, 6) Code on Demand optional (server can send JS). Resource = /books, verb = GET, status 200 OK returns JSON.",steps:["Client GET /books?category=ml -> Server returns JSON array with 200 OK","Stateless: Server does not remember previous request, token in header Authorization: Bearer ...","Cacheable: GET responses with Cache-Control","Uniform Interface: /books/{id} same for all clients","Layered: Can add CDN, load balancer without client change"],code:`// Fetch REST API
fetch('/api/books?category=ml', {
  method: 'GET',
  headers: { 'Authorization': 'Bearer token123' }
})
.then(res => {
  if(!res.ok) throw new Error(res.status);
  return res.json();
})
.then(data => console.log(data));
// Status: 200 OK, 201 Created, 204 No Content`,codeLang:"js",whyAsked:"Tests fundamentals, not just coding.",commonMistake:"Saying REST = HTTP, or forgetting stateless meaning.",followUps:["REST vs GraphQL vs gRPC?","Why stateless matters for scaling?"]},{id:14,category:"API",type:"Real Scraped",difficulty:"Medium",title:"Negative test cases for REST API - Freshworks Chennai May 2024",source:"Freshworks Chennai May 2024 • Real Scraped",analogy:"Testing canteen: what if you order without money, wrong item, injection of extra chutney.",verifiedAnswer:"Negative tests verify API fails gracefully: 1) Missing required params -> 400 Bad Request, 2) Invalid type (string for int) -> 400, 3) Invalid enum category=xyz -> 400, 4) SQL injection '; DROP TABLE -> 400 sanitized, 5) Unauthorized no token -> 401, 6) Forbidden student accessing admin -> 403, 7) Not Found id 99999 -> 404, 8) Rate limit exceed -> 429, 9) Payload too large -> 413, 10) Method not allowed POST on GET-only -> 405. Positive: valid request 200/201.",steps:["Boundary: POST /issue without book_id",'Type: book_id = "abc" instead of int',"Security: Try SQL injection in title param","Auth: Call without token","Rate limit: 100 req/sec same IP"],code:`// Negative test examples
// 1 Missing param
fetch('/api/issue', {method:'POST', body: JSON.stringify({})}).then(r=>console.log(r.status)); // expect 400
// 2 Invalid type
fetch('/api/books?id=abc').then(r=>console.log(r.status)); // 400
// 3 SQL injection
fetch('/api/books?title=\\' OR 1=1 --').then(r=>console.log(r.status)); // 400 sanitized
// 4 No auth
fetch('/api/admin/books').then(r=>console.log(r.status)); // 401`,codeLang:"js",whyAsked:"Checks quality mindset and security awareness.",commonMistake:"Only testing happy path, not checking status codes.",followUps:["How to test rate limiting?","What is fuzz testing?"]},{id:15,category:"API",type:"Descriptive",difficulty:"Medium",title:"Idempotency - GET PUT DELETE idempotent, POST not. Why?",source:"",analogy:"Pressing lift button multiple times same floor - same result (idempotent). Pressing call bell POST creates new notification each time.",verifiedAnswer:"Idempotent = multiple identical requests have same effect as single. GET: fetch same data, no side effect -> idempotent. PUT: update book 1 to title=X, doing twice same result -> idempotent. DELETE: delete id 1, second delete returns 404 but state same (deleted) -> idempotent. POST: create new book each time creates new id -> not idempotent. Use Idempotency-Key header for POST to make safe retry.",steps:["GET /books/1 repeated -> same book, no change",'PUT /books/1 {title:"ML"} twice -> title still ML',"DELETE /books/1 twice -> first 200, second 404 but DB state same deleted",'POST /books {title:"New"} twice -> creates two books with different ids',"For safe retries, server stores Idempotency-Key"],code:`// Idempotent PUT
curl -X PUT /api/books/1 -d '{"title":"ML"}' // run twice same result
// Non-idempotent POST
curl -X POST /api/books -d '{"title":"ML"}' // creates new each time
// Making POST idempotent with key
fetch('/api/issue', {
  method:'POST',
  headers:{'Idempotency-Key':'abc-123'},
  body: JSON.stringify({book_id:1})
});`,codeLang:"js",whyAsked:"Important for retries, network failures.",commonMistake:"Thinking POST is idempotent, or DELETE not idempotent because second returns 404.",followUps:["How to implement idempotency key?","Why important for payments?"]},{id:16,category:"API",type:"Descriptive",difficulty:"Easy",title:"HTTP status codes you must know",source:"",analogy:"Status codes = canteen token numbers: 200 food ready, 201 new dish created, 400 wrong order, 401 no ID card, 404 dish not found.",verifiedAnswer:"2xx Success: 200 OK (GET success), 201 Created (POST), 204 No Content (DELETE). 4xx Client error: 400 Bad Request (validation), 401 Unauthorized (no token), 403 Forbidden (no permission), 404 Not Found, 405 Method Not Allowed, 429 Too Many Requests (rate limit). 5xx Server error: 500 Internal Server Error, 502 Bad Gateway, 503 Service Unavailable. Verified standard.",steps:["2xx = success, client happy","4xx = client mistake, fix request","5xx = server mistake, retry maybe","401 vs 403: 401 not logged in, 403 logged in but no access","Use correct codes, not always 200 with error message"],code:`// Express.js example returning correct codes
app.get('/books/:id', (req,res)=>{
  const book = find(req.params.id);
  if(!book) return res.status(404).json({error:'Not found'});
  res.status(200).json(book);
});
app.post('/books', (req,res)=>{
  if(!req.body.title) return res.status(400).json({error:'Title required'});
  const newBook = create(req.body);
  res.status(201).json(newBook);
});`,codeLang:"js",whyAsked:"Tests if you know REST semantics.",commonMistake:"Confusing 401 vs 403, returning 200 for errors.",followUps:["When to use 400 vs 422?","What is 429?"]},{id:17,category:"API",type:"MCQ",difficulty:"Easy",title:"MCQ: Which status for resource created successfully?",analogy:"New book added to library = new token 201.",verifiedAnswer:"201 Created, with Location header pointing to new resource.",steps:["POST creates","201 indicates created","Location: /books/123"],code:"res.status(201).location('/books/123').json(newBook);",codeLang:"js",whyAsked:"Status code semantics.",commonMistake:"Using 200 for creation.",followUps:["What header comes with 201?"],options:[{label:"A",text:"200 OK"},{label:"B",text:"201 Created"},{label:"C",text:"204 No Content"},{label:"D",text:"400 Bad Request"}],correct:"B",explanation:{correctWhy:"RFC: 201 means new resource created, should include Location.",wrong:[{label:"A",reason:"200 is generic success, but not specific to creation."},{label:"C",reason:"204 means success but no body, used for DELETE."},{label:"D",reason:"400 is client error, not success."}],analogy:"New admission gets 201 roll number receipt."}},{id:18,category:"API",type:"MCQ",difficulty:"Easy",title:"MCQ: Which method is NOT idempotent?",analogy:"Lift button vs doorbell.",verifiedAnswer:"POST is not idempotent.",steps:["POST creates new each time"],code:`// POST twice = 2 resources
`,codeLang:"js",whyAsked:"Idempotency.",commonMistake:"Thinking PUT not idempotent.",followUps:["Why?"],options:[{label:"A",text:"GET"},{label:"B",text:"PUT"},{label:"C",text:"DELETE"},{label:"D",text:"POST"}],correct:"D",explanation:{correctWhy:"POST creates new resource each call, side effect changes.",wrong:[{label:"A",reason:"GET only reads, idempotent."},{label:"B",reason:"PUT overwrites same, idempotent."},{label:"C",reason:"DELETE state same after first delete."}],analogy:"POST like printing new ticket each press."}},{id:19,category:"API",type:"Descriptive",difficulty:"Medium",title:"Rate limiting - 429 Too Many Requests",source:"",analogy:"Canteen allowing only 1 samosa per minute per student, else say wait (429).",verifiedAnswer:"Rate limiting prevents abuse, uses token bucket or fixed window. Return 429 with Retry-After header. For library API: 100 req/min per IP. Implementation: Redis INCR with TTL. Client should backoff exponentially.",steps:["Count requests per key (IP/user) in time window","If count > limit, return 429","Include Retry-After: 60","Client waits and retries"],code:`// Node rate limiter with Redis
const rateLimit = async (ip)=>{
  const key = \`rate:\${ip}\`;
  const count = await redis.incr(key);
  if(count===1) await redis.expire(key, 60);
  if(count>100) throw {status:429, retryAfter: await redis.ttl(key)};
};`,codeLang:"js",whyAsked:"Production readiness.",commonMistake:"No Retry-After, or using 403 instead of 429.",followUps:["Token bucket vs leaky bucket?"]},{id:20,category:"API",type:"Descriptive",difficulty:"Medium",title:"Pagination - offset vs cursor",source:"",analogy:"Offset = page number (page 5 may shift if new book inserted). Cursor = bookmark pointing to last seen book stable.",verifiedAnswer:"Offset: ?page=2&limit=20 uses LIMIT OFFSET, simple but slow for large offset (scans), inconsistent if data changes. Cursor: ?cursor=eyJpZCI6MTAwfQ uses WHERE id > cursor_id ORDER BY id LIMIT, fast with index, stable, good for infinite scroll. Use cursor for large data.",steps:["Offset: SELECT * FROM books ORDER BY id LIMIT 20 OFFSET 40","Problem: OFFSET 100000 slow","Cursor: WHERE id > last_id ORDER BY id LIMIT 20","Cursor needs indexed sort column"],code:`// Offset
GET /api/books?offset=40&limit=20
-- SQL
SELECT * FROM books ORDER BY id LIMIT 20 OFFSET 40;
// Cursor (better)
GET /api/books?cursor=100&limit=20
-- SQL
SELECT * FROM books WHERE id > 100 ORDER BY id LIMIT 20;`,codeLang:"sql",whyAsked:"Performance at scale.",commonMistake:"Using offset for million rows.",followUps:["Why cursor better for real-time feed?"]},{id:21,category:"API",type:"Descriptive",difficulty:"Easy",title:"Authentication JWT vs API Key",source:"",analogy:"API Key = hostel room key static. JWT = temporary entry pass with expiry and permissions inside.",verifiedAnswer:"API Key: static string in header X-API-Key, long-lived, simple, no expiry, server stores. JWT: JSON Web Token header.payload.signature, short-lived, contains claims like user_id, role, exp, self-contained, stateless verification via signature. JWT better for user auth, API Key for server-to-server.",steps:["API Key: client sends X-API-Key: abc123","Server lookup in DB","JWT: server signs {user_id, role, exp} with secret","Client sends Authorization: Bearer <jwt>","Server verifies signature without DB lookup"],code:`// JWT generation
const jwt = require('jsonwebtoken');
const token = jwt.sign({usn:'1RV21CS001', role:'student'}, 'secret', {expiresIn:'1h'});
// Verify
jwt.verify(token, 'secret');
// API Key check
if(req.headers['x-api-key'] !== process.env.API_KEY) return res.status(401).send();`,codeLang:"js",whyAsked:"Security basics.",commonMistake:"Storing JWT in localStorage vulnerable to XSS - use httpOnly cookie.",followUps:["JWT structure? Refresh token?"]},{id:22,category:"API",type:"Descriptive",difficulty:"Medium",title:"REST vs GraphQL vs gRPC",source:"",analogy:"REST = fixed menu combo, GraphQL = buffet pick exactly what you want, gRPC = kitchen intercom super fast binary.",verifiedAnswer:"REST: resources via HTTP verbs, JSON, caching, simple. GraphQL: single endpoint, client specifies fields, avoids over/under-fetching, good for mobile. gRPC: binary protobuf over HTTP/2, 10x faster, streaming, used for microservices internal. Library: REST for public books API, GraphQL for dashboard where student needs only title+due_date, gRPC between issue service and fine service.",steps:["REST GET /books/1 returns all fields","GraphQL query { book(id:1){title, author{name}} } returns only needed","gRPC uses .proto definition, binary"],code:`// GraphQL query
query { book(id:1){ title author{ name } available_count } }
// gRPC proto
service Library { rpc IssueBook(IssueRequest) returns (IssueResponse); }
message IssueRequest { int32 book_id=1; string usn=2; }`,codeLang:"js",whyAsked:"Choosing right tool.",commonMistake:"Using GraphQL for everything even when REST caching enough.",followUps:["When to pick gRPC?"]},{id:23,category:"API",type:"Descriptive",difficulty:"Medium",title:"HATEOAS and API versioning",source:"",analogy:"HATEOAS = menu with links to next dishes. Versioning = library edition v1, v2.",verifiedAnswer:"HATEOAS: Response includes links to related actions: _links: {self, issue, return}. Helps discoverability. Versioning: URL /api/v1/books or header Accept: application/vnd.library.v1+json. URL versioning simpler, header cleaner. Maintain backward compatibility.",steps:["Include _links in JSON","Version via URL","Deprecate old with Sunset header"],code:`{

def attention(Q,K,V):
  d=K.shape[-1]

  out_w = w-kw+1

      out[i,j]=np.max(x[i*stride:i*stride+size, j*stride:j*stride+size])
  return out

  inter_x2 = min(boxA[2], boxB[2])

def positional_encoding(pos, d_model):
  pe = np.zeros(d_model)

  const now = Date.now();
  const windowStart = now - windowSec*1000;
  await redis.zremrangebyscore(key, 0, windowStart);
  const count = await redis.zcard(key);
  if(count >= limit) return false;
  await redis.zadd(key, now, now.toString());
  await redis.expire(key, windowSec);
  return true;
}`,codeLang:"js",whyAsked:"Rate limiting algo.",commonMistake:"Fixed window allows burst at edge.",followUps:["Token bucket?"]},{id:166,category:"AI Agents",type:"Descriptive",difficulty:"Hard",title:"Reflection pattern - agent critiques own plan",analogy:"Reflection = student checking own answer before submitting.",verifiedAnswer:"After action, agent reflects: Did I achieve goal? What went wrong? How to improve? Prompt: Reflect on previous steps... Improves success. Use second LLM call as critic.",steps:["Execute","Reflect","Adjust plan"],code:`thought = "I issued book but forgot to check fine, need reflect"
